services:
  apolloserver:
    container_name: apolloserver
    image: apolloserver
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:4000"
    networks:
      - elk

  elasticsearch:
    image: elasticsearch:7.9.1
    container_name: elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - test_data:/usr/share/elasticsearch/data/
      - ./elk-config/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
    environment:
      - discovery.type=single-node
      - http.host=0.0.0.0
      - transport.host=0.0.0.0
      - xpack.security.enabled=false
      - xpack.monitoring.enabled=false
      - cluster.name=elasticsearch
      - bootstrap.memory_lock=true
    networks:
      - elk
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://elasticsearch:9200/_cluster/health || exit 1"]
      interval: 40s
      timeout: 30s
      retries: 10

  kibana:
    image: kibana:7.9.1
    container_name: kibana
    ports:
      - "5601:5601"
    volumes:
      - ./elk-config/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml
      - kb_data:/usr/share/kibana/data
    networks:
      - elk
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test:
        [ "CMD-SHELL", "curl -s -I http://kibana:5601 | grep -q 'HTTP/1.1 302 Found'"]
      interval: 40s
      timeout: 10s
      retries: 120

  metricbeat:
    image: docker.elastic.co/beats/metricbeat:7.9.1
    container_name: metricbeat
    user: root
    volumes:
      - ./elk-config/metricbeat/metricbeat.yml:/usr/share/metricbeat/metricbeat.yml
      - /var/run/docker.sock:/var/run/docker.sock
      - /sys/fs/cgroup:/hostfs/sys/fs/cgroup:ro
      - /proc:/hostfs/proc:ro
      - /:/hostfs:ro
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - elk
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_healthy
    restart: on-failure
    command: ["sh", "-c", "chmod go-w /usr/share/metricbeat/metricbeat.yml && metricbeat -e"]
  
  # filebeat:
  #   image: elastic/filebeat:7.9.1
  #   container_name: filebeat
  #   user: root
  #   command: ["filebeat", "-e", "--strict.perms=false"]
  #   volumes:
  #     - ./elk-config/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
  #     - /var/lib/docker/containers:/var/lib/docker/containers:ro
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #     - /var/log/syslog:/var/log/syslog:ro
  #     - /var/log/auth.log:/var/log/auth.log:ro
  #   networks:
  #     - elk
  #   depends_on:
  #     - elasticsearch
  #     - kibana

networks:
  elk:
    name: elk
    driver: bridge

volumes:
  test_data:
  kb_data: