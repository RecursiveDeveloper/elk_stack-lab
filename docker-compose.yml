services:

  # ── Apollo GraphQL server ─────────────────────────────────────────────────────
  apolloserver:
    container_name: apolloserver
    image: apolloserver
    build:
      context: .
      dockerfile: dockerfile
    ports:
      - "3000:4000"
    environment:
      NODE_ENV: development
      APM_SERVICE_NAME: apollo-server
      APM_SERVER_URL: http://apm-server:8200
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: lab
      PGUSER: lab
      PGPASSWORD: lab
      LOG_LEVEL: info
    networks:
      - elk
    depends_on:
      postgres:
        condition: service_healthy
      apm-server:
        condition: service_started

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: lab
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - elk
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── k6 load generator ─────────────────────────────────────────────────────────
  k6:
    image: grafana/k6:0.57.0
    container_name: k6
    volumes:
      - ./load-generator:/scripts
    command: ["run", "/scripts/script.js"]
    networks:
      - elk
    depends_on:
      - apolloserver

  # ── Elasticsearch ─────────────────────────────────────────────────────────────
  elasticsearch:
    image: elasticsearch:7.17.19
    container_name: elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - test_data:/usr/share/elasticsearch/data/
      - ./elk-config/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
    environment:
      - discovery.type=single-node
      - http.host=0.0.0.0
      - transport.host=0.0.0.0
      - xpack.security.enabled=false
      - xpack.monitoring.enabled=false
      - cluster.name=elasticsearch
      - bootstrap.memory_lock=true
    networks:
      - elk
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://elasticsearch:9200/_cluster/health || exit 1"]
      interval: 40s
      timeout: 30s
      retries: 10

  # ── Kibana ────────────────────────────────────────────────────────────────────
  kibana:
    image: kibana:7.17.19
    container_name: kibana
    ports:
      - "5601:5601"
    volumes:
      - ./elk-config/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml
      - kb_data:/usr/share/kibana/data
    networks:
      - elk
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s -I http://kibana:5601 | grep -q 'HTTP/1.1 302 Found'"]
      interval: 40s
      timeout: 10s
      retries: 120

  # ── Metricbeat ────────────────────────────────────────────────────────────────
  metricbeat:
    image: docker.elastic.co/beats/metricbeat:7.17.19
    container_name: metricbeat
    user: root
    volumes:
      - ./elk-config/metricbeat/metricbeat.yml:/usr/share/metricbeat/metricbeat.yml
      - /var/run/docker.sock:/var/run/docker.sock
      - /sys/fs/cgroup:/hostfs/sys/fs/cgroup:ro
      - /proc:/hostfs/proc:ro
      - /:/hostfs:ro
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - elk
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_healthy
    restart: on-failure
    command: ["sh", "-c", "metricbeat -e --strict.perms=false"]

  # ── Filebeat ──────────────────────────────────────────────────────────────────
  filebeat:
    image: elastic/filebeat:7.17.19
    container_name: filebeat
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./elk-config/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log/syslog:/var/log/syslog:ro
      - /var/log/auth.log:/var/log/auth.log:ro
    networks:
      - elk
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_healthy

  # ── APM Server ────────────────────────────────────────────────────────────────
  apm-server:
    image: elastic/apm-server:7.17.19
    container_name: apm-server
    ports:
      - "8200:8200"
    volumes:
      - ./elk-config/apm-server/apm-server.yml:/usr/share/apm-server/apm-server.yml
    networks:
      - elk
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_healthy
    command: ["sh", "-c", "apm-server -e --strict.perms=false"]

networks:
  elk:
    name: elk
    driver: bridge

volumes:
  test_data:
  kb_data:
  pg_data:
